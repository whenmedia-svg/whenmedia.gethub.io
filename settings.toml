# Upload files to the "media" folder on GitHub, then write the
# file's name here.

banner_photo = "WuendyC.Photo.jpeg"   # A portrait or banner photo of you
resume = "media/resume.pdf"         # A PDF of your resume (adds a Resume button)
favicon = ""                        # Tiny browser-tab icon. Empty = made for you

# ── About you ───────────────────────────────────────────────
#
# Your bio. Keep the three quote marks (""") on their own lines.
# A blank line starts a new paragraph.

bio = """
I'm a journalism student at UC Berkeley with a focus on multimedia
storytelling. I’m also a Bay Area–based Maya Mam storyteller and creative 
dedicated to building more equitable, community-centered media. My work is rooted 
in the belief that stories shape how we see ourselves—and too 
often, the stories of Indigenous and marginalized communities 
are overlooked, simplified, or told without us.

As a filmmaker,media producer and journalist, my goal is to create stories and projects 
that honor culture, lived experience, and community truth. I’m passionate 
about using media as a tool for representation, connection, and 
visibility—especially for communities like my own, who navigate 
the world through heritage, migration, resilience, and 
multilingual identity.

When I'm not reporting, you'll find me hiking in a forest or spending time
exploring the Bay Area with my friends and family. 
"""

# Optional extra line at the bottom of every page.
footer = ""


# ============================================================
