url = "https://example.com/your-story-link-goes-here"
image = "media/work/bike-lanes.jpg"
date = "March 2026"
category = "Journalism"
outlet = "Berkeleyside"

[[work]]
title = "The wells are running dry: a Central Valley town confronts its future"
description = "In Teviston, families have watched their taps sputter for years. Now a state grant promises relief — but the water table keeps falling faster than the money arrives."
url = "https://example.com/your-story-link-goes-here"
image = "media/work/drought.jpg"
date = "January 2026"
category = "Journalism"
outlet = "The San Francisco Chronicle"

[[work]]
